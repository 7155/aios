course:
  id: aios-ime-v5
  title: AIOS-IME 双轨课程
  version: "5.1"
  language: zh-CN
  source:
    repository: 7155/aios
    revision: 9f53740753de36899aa7694cf7dcb5304e58ea54
    legacy_specialty_revision: bfc72896bbadab5c897672506d237c070900412e
  learner:
    prerequisites:
      - Python 基础
      - 了解 Transformer 自回归生成
    not_required:
      - 先读完整仓库
      - 先掌握 CUDA Kernel
  contracts:
    question_heading: 练习题
    readme_is_textbook: true
    evidence_before_claim: true
    practice_track_runnable_stages: true
    mechanism_track_runtime_spine: true
    progressive_disclosure: true
    web_portal_manifest_driven: true
    source_symbols_machine_checked: true
    stage_artifacts_required: true
    frozen_reports_never_presented_as_rerun: true

delivery:
  web:
    entry: course/aios-ime/index.html
    manifest: course/aios-ime/site-manifest.json
    local_command: python -m http.server --directory course/aios-ime 8000
    markdown_is_source_of_truth: true
    browser_progress_is_advisory: true
  support:
    learning_paths: LEARNING_PATHS.md
    visual_atlas: VISUAL_ATLAS.md
    source_map: SOURCE_MAP.md
    workbook: WORKBOOK.md
    troubleshooting: TROUBLESHOOTING.md
  validation:
    command: python course/aios-ime/scripts/validate_course.py
    source_symbols: source-symbols.json
    workflow: .github/workflows/aios-ime-course.yml

