<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620"><style>.t{font:15px system-ui;fill:#263238}.h{font:700 19px system-ui;fill:#17202a}.title{font:700 28px system-ui;fill:#17202a}.b{fill:#f7faf9;stroke:#315c57;stroke-width:2;rx:12}.w{fill:#eef4fa;stroke:#496a89;stroke-width:1.5;rx:8}.wait{fill:#fff3ee;stroke:#9a6047;stroke-width:1.5;rx:8}.run{fill:#edf4ee;stroke:#718b76;stroke-width:1.5;rx:8}</style><text x="45" y="48" class="title">一个 SM 用多个驻留 Warp 隐藏等待</text><rect x="45" y="90" width="1110" height="465" class="b"/><text x="70" y="130" class="h">SM 0：有限 Register File + Shared Memory 决定能同时驻留多少 Block/Warp</text><rect x="80" y="165" width="235" height="330" class="w"/><text x="105" y="200" class="h">Block A · 8 warps</text><rect x="105" y="225" width="180" height="45" class="wait"/><text x="125" y="253" class="t">Warp 0：等 HBM</text><rect x="105" y="285" width="180" height="45" class="run"/><text x="125" y="313" class="t">Warp 1：执行 FMA</text><rect x="105" y="345" width="180" height="45" class="w"/><text x="125" y="373" class="t">Warp 2：Ready</text><rect x="105" y="405" width="180" height="45" class="w"/><text x="125" y="433" class="t">Warp 3..7</text><rect x="360" y="165" width="235" height="330" class="w"/><text x="385" y="200" class="h">Block B · 8 warps</text><text x="385" y="250" class="t">更多 Ready Warp</text><text x="385" y="285" class="t">→ Scheduler 可切换</text><text x="385" y="340" class="t">若寄存器翻倍</text><text x="385" y="375" class="t">→ 驻留 Block 可能减半</text><text x="385" y="430" class="t">→ latency hiding 变差</text><rect x="640" y="165" width="460" height="330" class="b"/><text x="670" y="205" class="h">Warp Scheduler 时间线</text><text x="680" y="255" class="t">cycle →  W0 load → W1 FMA → W2 FMA → W8 load → W1 ...</text><text x="680" y="315" class="t">Occupancy = active warps / max warps</text><text x="680" y="360" class="t">不是 ALU 利用率，也不是速度保证</text><text x="680" y="420" class="t">性能平衡：数据复用 / Register / Shared / Warp 数</text></svg>