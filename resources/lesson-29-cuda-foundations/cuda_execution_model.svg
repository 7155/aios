<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680">
  <defs><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L10,3 L0,6 Z" fill="#315c57"/></marker><style>.title{font:700 28px system-ui,sans-serif;fill:#17202a}.h{font:700 18px system-ui,sans-serif;fill:#17202a}.t{font:15px system-ui,sans-serif;fill:#263238}.s{font:13px system-ui,sans-serif;fill:#455a64}.b{fill:#f7faf9;stroke:#315c57;stroke-width:2;rx:12}.gpu{fill:#eef4fa;stroke:#496a89;stroke-width:2;rx:12}.mem{fill:#edf4ee;stroke:#718b76;stroke-width:2;rx:10}.l{stroke:#315c57;stroke-width:2;marker-end:url(#a)}</style></defs>
  <text x="45" y="48" class="title">CUDA 执行模型：Python 发射工作，GPU 在 Stream 中异步完成</text>
  <rect x="45" y="105" width="300" height="470" class="b"/><text x="75" y="145" class="h">Host / CPU</text><text x="75" y="185" class="t">Python Scheduler</text><text x="75" y="220" class="t">构造 Tensor Shape / Pointer</text><text x="75" y="255" class="t">准备 Page Table / Metadata</text><text x="75" y="290" class="t">发射 Kernel 到 CUDA Stream</text><text x="75" y="345" class="s">调用通常在 GPU 完成前返回</text><text x="75" y="385" class="s">字符串治理、候选去重仍在 CPU</text><rect x="75" y="435" width="240" height="90" class="mem"/><text x="100" y="470" class="t">Pinned Host Memory</text><text x="100" y="497" class="s">支持 non_blocking H2D 拷贝</text>
  <line x1="345" y1="290" x2="430" y2="290" class="l"/><rect x="435" y="105" width="715" height="470" class="gpu"/><text x="465" y="145" class="h">Device / GPU</text><rect x="465" y="175" width="650" height="75" class="b"/><text x="490" y="207" class="t">CUDA Stream：Kernel A → Kernel B → Memory Copy C</text><text x="490" y="232" class="s">同一 Stream 保序；CPU 不必逐个等待</text><text x="475" y="295" class="h">Kernel Grid</text><rect x="475" y="320" width="180" height="105" class="b"/><text x="500" y="352" class="t">Block 0</text><text x="500" y="380" class="s">Warps × 32 threads</text><text x="500" y="405" class="s">处理数据块 0</text><rect x="690" y="320" width="180" height="105" class="b"/><text x="715" y="352" class="t">Block 1</text><text x="715" y="380" class="s">Warps × 32 threads</text><text x="715" y="405" class="s">处理数据块 1</text><rect x="905" y="320" width="180" height="105" class="b"/><text x="930" y="352" class="t">Block N</text><text x="930" y="380" class="s">独立调度</text><text x="930" y="405" class="s">处理数据块 N</text><rect x="475" y="465" width="610" height="75" class="mem"/><text x="500" y="497" class="t">Global Memory：Weights / KV Cache / Activations / Workspace</text><text x="500" y="523" class="s">Fusion 的核心收益常是少读写这里，而不只是少做数学运算</text>
  <text x="45" y="630" class="s">torch.cuda.synchronize() 或 CUDA Event 才能让计时覆盖 GPU 完成；否则常只测到 enqueue/launch。</text>
</svg>
