<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="640" viewBox="0 0 1200 640"><style>.title{font:700 28px system-ui;fill:#17202a}.h{font:700 18px system-ui;fill:#17202a}.t{font:14px system-ui;fill:#263238}.b{fill:#f7faf9;stroke:#315c57;stroke-width:2;rx:12}.used{fill:#496a89}.free{fill:#dfe9df}.frag{fill:#e9c9b8}</style><text x="45" y="48" class="title">PyTorch Caching Allocator：Tensor Block 已释放，不等于 Segment 立即还给 Driver</text><rect x="55" y="100" width="1090" height="430" class="b"/><text x="85" y="140" class="h">Driver Segment / reserved memory</text><rect x="90" y="185" width="200" height="85" class="used"/><text x="135" y="235" class="t" fill="white">active 20</text><rect x="290" y="185" width="100" height="85" class="free"/><text x="315" y="235" class="t">free 10</text><rect x="390" y="185" width="300" height="85" class="used"/><text x="500" y="235" class="t" fill="white">active 30</text><rect x="690" y="185" width="150" height="85" class="frag"/><text x="730" y="235" class="t">free 15</text><rect x="840" y="185" width="250" height="85" class="used"/><text x="930" y="235" class="t" fill="white">active 25</text><text x="90" y="330" class="t">allocated = active Tensor blocks = 75</text><text x="90" y="370" class="t">reserved = allocator managed segment = 100</text><text x="90" y="410" class="t">free total = 25，但最大连续 free = 15 → 申请 20 仍可能需要新 Segment</text><text x="90" y="470" class="t">empty_cache() 只尝试归还未被 active Tensor 使用的缓存 Block；不会删除权重/KV。</text><text x="55" y="580" class="t">AIOS 长期：权重 / KV Pool / FlashInfer Workspace；短期：QKV / Logits / Metadata。稳定延迟往往需要有界 Buffer 复用。</text></svg>