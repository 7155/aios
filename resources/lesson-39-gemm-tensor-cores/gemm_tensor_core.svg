<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630"><style>.title{font:700 28px system-ui;fill:#17202a}.h{font:700 18px system-ui;fill:#17202a}.t{font:14px system-ui;fill:#263238}.b{fill:#f7faf9;stroke:#315c57;stroke-width:2;rx:12}.p{fill:#eef4fa;stroke:#496a89;stroke-width:2;rx:10}.d{fill:#fff3ee;stroke:#9a6047;stroke-width:2;rx:10}</style><text x="45" y="48" class="title">同一 QKV Weight：Prefill 大 M 复用权重，Decode 小 M 更像带宽问题</text><rect x="55" y="95" width="330" height="160" class="p"/><text x="85" y="135" class="h">Prefill</text><text x="85" y="175" class="t">X [128,768] @ Wᵀ [768,1280]</text><text x="85" y="210" class="t">M=128：每个权重服务 128 rows</text><rect x="55" y="300" width="330" height="160" class="d"/><text x="85" y="340" class="h">8 路 Decode</text><text x="85" y="380" class="t">X [8,768] @ Wᵀ [768,1280]</text><text x="85" y="415" class="t">M=8：仍读取同一份大权重</text><rect x="440" y="95" width="320" height="365" class="b"/><text x="470" y="135" class="h">GEMM Tile</text><text x="470" y="180" class="t">C_tile [BM,BN]</text><text x="470" y="220" class="t">for K tile:</text><text x="500" y="255" class="t">load A_tile [BM,BK]</text><text x="500" y="290" class="t">load B_tile [BK,BN]</text><text x="500" y="325" class="t">Tensor Core MMA</text><text x="500" y="360" class="t">FP32 accumulator</text><text x="470" y="410" class="t">Tile / dtype / alignment 决定效率</text><rect x="815" y="95" width="330" height="365" class="b"/><text x="845" y="135" class="h">Arithmetic Intensity</text><text x="845" y="185" class="t">I ≈ MNK / (MK + NK + MN)</text><text x="845" y="230" class="t">M=8   → ≈ 7.85 FLOPs/B</text><text x="845" y="270" class="t">M=128 → ≈106.7 FLOPs/B</text><text x="845" y="325" class="t">Decode：Memory / Latency 倾向</text><text x="845" y="365" class="t">Prefill：Compute 倾向</text><text x="845" y="415" class="t">实际仍需 Profiler 验证</text></svg>