<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="760" viewBox="0 0 1280 760"><defs><marker id="m" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0 0L10 3L0 6Z" fill="#315c57"/></marker></defs><style>.title{font:700 28px system-ui;fill:#17202a}.h{font:700 17px system-ui;fill:#17202a}.t{font:14px system-ui;fill:#263238}.s{font:12.5px system-ui;fill:#455a64}.b{fill:#f7faf9;stroke:#315c57;stroke-width:2;rx:12}.a{stroke:#315c57;stroke-width:2;marker-end:url(#m)}</style><text x="35" y="48" class="title">ImeCompletionEngine.complete：一次按键的组级状态机</text>
<rect x="45" y="100" width="190" height="110" class="b"/><text x="70" y="138" class="h">1. Tokenize + BOS</text><text x="70" y="172" class="t">context / page budget</text><line x1="235" y1="155" x2="285" y2="155" class="a"/>
<rect x="290" y="100" width="190" height="110" class="b"/><text x="315" y="138" class="h">2. Prefix prepare</text><text x="315" y="172" class="t">same / LCP / extend</text><line x1="480" y1="155" x2="530" y2="155" class="a"/>
<rect x="535" y="100" width="190" height="110" class="b"/><text x="560" y="138" class="h">3. First 8 branches</text><text x="560" y="172" class="t">shared logits + pages</text><line x1="725" y1="155" x2="775" y2="155" class="a"/>
<rect x="780" y="100" width="190" height="110" class="b"/><text x="805" y="138" class="h">4. Materialize</text><text x="805" y="172" class="t">text / raw score / free suffix</text><line x1="970" y1="155" x2="1020" y2="155" class="a"/>
<rect x="1025" y="100" width="205" height="110" class="b"/><text x="1050" y="138" class="h">5. Select Top-3</text><text x="1050" y="172" class="t">filter / dedup / MMR</text>
<path d="M1125 210V300H875V240" fill="none" class="a"/><text x="930" y="285" class="s">不足三条且未到 12 attempts</text><rect x="745" y="330" width="260" height="115" class="b"/><text x="770" y="370" class="h">6. Refill 4 branches</text><text x="770" y="405" class="t">new seed / higher T / larger top-k</text>
<line x1="875" y1="445" x2="875" y2="500" class="a"/><rect x="745" y="505" width="260" height="115" class="b"/><text x="770" y="545" class="h">7. Return Result</text><text x="770" y="580" class="t">generation id / latency / page diagnostics</text>
<rect x="75" y="330" width="520" height="290" class="b"/><text x="100" y="370" class="h">所有阶段都受两个横向不变量约束</text><text x="110" y="415" class="t">Cancellation：每个 token step 检查 latest-wins token</text><text x="110" y="455" class="t">Resource ownership：每批 suffix page 在 finally/物化后释放</text><text x="110" y="510" class="t">Persistent prefix pages 由下一次 `_prepare_prefix` 决定 keep/free</text><text x="110" y="555" class="s">结果可取消，资源不可遗忘；分支可补采样，旧 suffix 不与 refill 同时常驻。</text></svg>
