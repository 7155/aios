<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650"><defs><marker id="m" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0 0L10 3L0 6Z" fill="#315c57"/></marker></defs><style>.title{font:700 28px system-ui;fill:#17202a}.h{font:700 18px system-ui;fill:#17202a}.t{font:15px system-ui;fill:#263238}.s{font:13px system-ui;fill:#455a64}.b{fill:#f7faf9;stroke:#315c57;stroke-width:2;rx:12}.a{stroke:#315c57;stroke-width:2;marker-end:url(#m)}</style><text x="40" y="48" class="title">Flat Varlen Prefill：不同长度请求拼成一条 Token 流，但保留各自边界</text>
<rect x="55" y="110" width="250" height="165" class="b"/><text x="80" y="148" class="h">Token Pool（二维逻辑存储）</text><text x="80" y="185" class="t">slot 2: [A0,A1,A2]</text><text x="80" y="220" class="t">slot 0: [B0,B1,B2,B3,B4]</text><text x="80" y="250" class="s">长度 3 与 5，不 Padding</text>
<line x1="305" y1="195" x2="390" y2="195" class="a"/><rect x="395" y="100" width="315" height="185" class="b"/><text x="420" y="140" class="h">_make_input_tuple + positions</text><text x="420" y="178" class="t">mapping = [2,2,2, 0,0,0,0,0]</text><text x="420" y="213" class="t">positions = [0,1,2, 0,1,2,3,4]</text><text x="420" y="248" class="t">input_ids = [A0,A1,A2,B0…B4]</text>
<line x1="710" y1="195" x2="795" y2="195" class="a"/><rect x="800" y="100" width="335" height="185" class="b"/><text x="825" y="140" class="h">Attention Metadata</text><text x="825" y="178" class="t">q lengths = [3,5]</text><text x="825" y="213" class="t">cu_q = [0,3,8]</text><text x="825" y="248" class="t">last indices = [2,7]</text>
<rect x="190" y="380" width="820" height="155" class="b"/><text x="220" y="420" class="h">为什么不需要 Dense Padding Mask？</text><text x="220" y="458" class="t">FlashInfer 由 cumulative sequence lengths 知道每条序列在 Flat Tensor 中的起止；每条序列单独执行 causal attention。</text><text x="220" y="493" class="s">Flat 并不丢失边界：边界从矩形 Padding/Mask 改由 cu_seqlens 与 Paged KV indices 表达。</text></svg>
