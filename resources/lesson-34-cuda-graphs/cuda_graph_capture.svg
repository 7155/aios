<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650">
  <defs><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L10,3 L0,6 Z" fill="#315c57"/></marker><style>.title{font:700 28px system-ui,sans-serif;fill:#17202a}.h{font:700 18px system-ui,sans-serif;fill:#17202a}.t{font:14px system-ui,sans-serif;fill:#263238}.s{font:12px system-ui,sans-serif;fill:#455a64}.b{fill:#f7faf9;stroke:#315c57;stroke-width:2;rx:12}.g{fill:#eef4fa;stroke:#496a89;stroke-width:2;rx:10}.w{fill:#fff3ee;stroke:#9a6047;stroke-width:2;rx:10}.l{stroke:#315c57;stroke-width:2;marker-end:url(#a)}</style></defs>
  <text x="45" y="48" class="title">CUDA Graph：记录一串 Kernel Launch，再用固定 Buffer 重放</text>
  <rect x="45" y="105" width="325" height="460" class="b"/><text x="70" y="145" class="h">Eager · 每个 Token Step</text><g class="t"><text x="75" y="190">CPU launch QKV</text><text x="75" y="225">CPU launch Norm/RoPE</text><text x="75" y="260">CPU launch Attention</text><text x="75" y="295">CPU launch O Projection</text><text x="75" y="330">CPU launch MLP...</text><text x="75" y="380">× 14 layers</text></g><text x="75" y="440" class="s">小模型时 GPU Kernel 短，</text><text x="75" y="464" class="s">CPU/Driver 发射占比可能很高。</text>
  <line x1="370" y1="335" x2="445" y2="335" class="l"/><rect x="450" y="105" width="300" height="460" class="g"/><text x="475" y="145" class="h">Capture once</text><rect x="480" y="180" width="240" height="210" class="b"/><text x="505" y="215" class="t">固定 static input address</text><text x="505" y="250" class="t">固定 output/workspace address</text><text x="505" y="285" class="t">固定 Kernel sequence</text><text x="505" y="320" class="t">固定 shape/control flow</text><text x="505" y="355" class="t">记录依赖与参数</text><text x="480" y="440" class="s">Capture 不等于执行融合；</text><text x="480" y="464" class="s">原 Kernel 仍在 Graph 内。</text>
  <line x1="750" y1="335" x2="825" y2="335" class="l"/><rect x="830" y="105" width="325" height="460" class="b"/><text x="855" y="145" class="h">Replay many times</text><text x="855" y="195" class="t">1. copy new data → static buffer</text><text x="855" y="235" class="t">2. graph.replay()</text><text x="855" y="275" class="t">3. read static output</text><rect x="855" y="320" width="270" height="105" class="w"/><text x="875" y="352" class="t">AIOS 难点：</text><text x="875" y="380" class="s">active rows: 8→6→4→1</text><text x="875" y="405" class="s">动态 Page/Metadata/取消</text><text x="855" y="470" class="s">需要 Graph Bucket 或固定空行，</text><text x="855" y="494" class="s">并与 Ragged Decode 做真实 A/B。</text>
</svg>
