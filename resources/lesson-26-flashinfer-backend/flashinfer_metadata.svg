<svg xmlns="http://www.w3.org/2000/svg" width="1250" height="700" viewBox="0 0 1250 700"><defs><marker id="m" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0 0L10 3L0 6Z" fill="#315c57"/></marker></defs><style>.title{font:700 28px system-ui;fill:#17202a}.h{font:700 18px system-ui;fill:#17202a}.t{font:15px system-ui;fill:#263238}.s{font:13px system-ui;fill:#455a64}.b{fill:#f7faf9;stroke:#315c57;stroke-width:2;rx:12}.a{stroke:#315c57;stroke-width:2;marker-end:url(#m)}</style><text x="35" y="48" class="title">FlashInfer Metadata：把 AIOS 的 Req/Page 状态翻译成 Kernel 能理解的数组</text>
<rect x="45" y="105" width="260" height="230" class="b"/><text x="70" y="145" class="h">AIOS Batch</text><text x="70" y="185" class="t">Req A: q_len=3, k_len=3</text><text x="70" y="220" class="t">Req B: q_len=2, k_len=5</text><text x="70" y="255" class="t">page rows: [7,4,9] / [2,8,1,6,3]</text><text x="70" y="295" class="s">Python 对象与二维 Page Table</text>
<line x1="305" y1="220" x2="385" y2="220" class="a"/><rect x="390" y="90" width="360" height="260" class="b"/><text x="415" y="130" class="h">prepare_metadata</text><text x="415" y="172" class="t">seqlens_q = [3,2]</text><text x="415" y="207" class="t">cu_q = [0,3,5]</text><text x="415" y="242" class="t">seqlens_k = [3,5]</text><text x="415" y="277" class="t">cu_k = [0,3,8]</text><text x="415" y="312" class="t">indices = [7,4,9,2,8,1,6,3]</text>
<line x1="750" y1="220" x2="830" y2="220" class="a"/><rect x="835" y="105" width="355" height="230" class="b"/><text x="860" y="145" class="h">Wrapper Plan（每 Batch 一次）</text><text x="860" y="185" class="t">Prefill: qo_indptr + paged_kv*</text><text x="860" y="220" class="t">Decode: indptr + seq_lens</text><text x="860" y="255" class="t">14 层共享同一 metadata/plan</text><text x="860" y="295" class="s">每层先 store_kv，再 wrapper.run</text>
<rect x="180" y="430" width="880" height="150" class="b"/><text x="210" y="468" class="h">为什么 `cu_seqlens` 很关键？</text><text x="210" y="510" class="t">Flat Q/K/V 没有 Padding 维度；累计长度数组给出每条序列的起止偏移，使 Kernel 能在一条连续 Token 流上恢复 Ragged 边界。</text><text x="210" y="545" class="s">`cu_q[i+1]-cu_q[i]` 是第 i 条 Query 长度；`cu_k` 同理。Page indices 再把逻辑 K/V 顺序映射到物理缓存。</text></svg>
