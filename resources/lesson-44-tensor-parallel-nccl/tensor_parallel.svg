<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="670" viewBox="0 0 1200 670"><style>.title{font:700 28px system-ui;fill:#17202a}.h{font:700 18px system-ui;fill:#17202a}.t{font:14px system-ui;fill:#263238}.b{fill:#f7faf9;stroke:#315c57;stroke-width:2;rx:12}.g0{fill:#eef4fa;stroke:#496a89;stroke-width:2;rx:10}.g1{fill:#edf4ee;stroke:#718b76;stroke-width:2;rx:10}.comm{fill:#fff3ee;stroke:#9a6047;stroke-width:2;rx:10}</style><text x="45" y="48" class="title">两卡 Tensor Parallel：Column 拆输出，Row 产生 Partial Output 再 AllReduce</text><text x="65" y="100" class="h">Column Parallel（QKV / Gate-Up）</text><rect x="65" y="125" width="220" height="100" class="b"/><text x="95" y="175" class="t">X [M,K] replicated</text><rect x="350" y="115" width="210" height="120" class="g0"/><text x="380" y="155" class="h">GPU 0</text><text x="380" y="190" class="t">W0 [N/2,K] → Y0</text><rect x="615" y="115" width="210" height="120" class="g1"/><text x="645" y="155" class="h">GPU 1</text><text x="645" y="190" class="t">W1 [N/2,K] → Y1</text><rect x="890" y="125" width="235" height="100" class="comm"/><text x="920" y="165" class="t">concat / keep sharded</text><text x="65" y="300" class="h">Row Parallel（O / Down）</text><rect x="65" y="330" width="220" height="100" class="b"/><text x="95" y="370" class="t">X0 / X1 sharded</text><rect x="350" y="320" width="210" height="120" class="g0"/><text x="380" y="360" class="h">GPU 0</text><text x="380" y="395" class="t">P0=X0 W0ᵀ</text><rect x="615" y="320" width="210" height="120" class="g1"/><text x="645" y="360" class="h">GPU 1</text><text x="645" y="395" class="t">P1=X1 W1ᵀ</text><rect x="890" y="320" width="235" height="120" class="comm"/><text x="920" y="360" class="h">NCCL AllReduce</text><text x="920" y="400" class="t">Y=P0+P1 on both ranks</text><text x="65" y="525" class="t">Compute roughly /2，但每层增加 Collective + Synchronization；0.1B 小模型可能通信固定延迟大于收益。</text><text x="65" y="575" class="t">当前 AIOS：local_kv_heads = num_kv_heads，尚未实现 TP；接入需要同时改 Weight Shard、Head、KV Layout、Backend 和 Manifest。</text></svg>