<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650"><defs><marker id="m" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0 0L10 3L0 6Z" fill="#315c57"/></marker></defs><style>.title{font:700 28px system-ui;fill:#17202a}.h{font:700 20px system-ui;fill:#17202a}.t{font:15px system-ui;fill:#263238}.s{font:13px system-ui;fill:#455a64}.b{fill:#f7faf9;stroke:#315c57;stroke-width:2;rx:14}.a{stroke:#315c57;stroke-width:2;marker-end:url(#m)}</style><text x="35" y="48" class="title">Scheduler 状态机：Pending → Prefill → Running Decode → Finished</text>
<rect x="45" y="120" width="220" height="150" class="b"/><text x="75" y="160" class="h">PendingReq</text><text x="75" y="198" class="t">只有 input_ids / params</text><text x="75" y="228" class="t">尚无 table slot / KV page</text>
<line x1="265" y1="195" x2="360" y2="195" class="a"/><text x="282" y="180" class="s">admit</text><rect x="365" y="120" width="220" height="150" class="b"/><text x="395" y="160" class="h">Prefill Batch</text><text x="395" y="198" class="t">分配 slot 与 Prompt page</text><text x="395" y="228" class="t">一次生成 first token</text>
<line x1="585" y1="195" x2="680" y2="195" class="a"/><text x="600" y="180" class="s">unfinished</text><rect x="685" y="120" width="220" height="150" class="b"/><text x="715" y="160" class="h">Running Set</text><text x="715" y="198" class="t">每轮一 token / request</text><text x="715" y="228" class="t">DecodeManager Set[Req]</text>
<path d="M795 270V350H685V290" fill="none" class="a"/><text x="810" y="330" class="s">next decode step</text><line x1="905" y1="195" x2="1000" y2="195" class="a"/><text x="920" y="180" class="s">EOS / budget</text><rect x="1005" y="120" width="150" height="150" class="b"/><text x="1030" y="160" class="h">Finished</text><text x="1030" y="198" class="t">保留 generated</text><text x="1030" y="228" class="t">释放 slot/page</text>
<rect x="195" y="420" width="810" height="145" class="b"/><text x="225" y="458" class="h">Prefill-first policy</text><text x="225" y="496" class="t">每轮先尝试从 Pending 中接纳一个 Prefill Batch；接纳不了或没有 Pending，才对全部 Running 请求做 Decode。</text><text x="225" y="530" class="s">优点：新请求更快获得 first token。边界：若持续有可接纳 Prefill，Decode 尾延迟和公平性需要额外策略治理。</text></svg>
