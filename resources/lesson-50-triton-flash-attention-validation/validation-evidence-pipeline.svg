    <text x="70" y="128" font-family="Noto Sans CJK SC, sans-serif" font-size="43" font-weight="800" fill="#0F172A" text-anchor="start">从“代码能跑”到“证据可信”</text>
    <text x="70" y="171" font-family="Noto Sans CJK SC, sans-serif" font-size="24" font-weight="500" fill="#475569" text-anchor="start">正确性、负向合同、显存与 Benchmark 必须组成一条完整证据链，最后再判断是否匹配 AIOS 产品路径。</text>
