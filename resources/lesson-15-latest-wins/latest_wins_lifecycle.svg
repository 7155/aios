<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650">
  <defs><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L10,3 L0,6 Z" fill="#315c57"/></marker><style>.title{font:700 28px system-ui,sans-serif;fill:#17202a}.h{font:700 18px system-ui,sans-serif;fill:#17202a}.t{font:15px system-ui,sans-serif;fill:#263238}.s{font:13px system-ui,sans-serif;fill:#455a64}.b{fill:#f7faf9;stroke:#315c57;stroke-width:2;rx:12}.old{fill:#fff3ee;stroke:#9a6047;stroke-width:2;rx:10}.new{fill:#eef4fa;stroke:#496a89;stroke-width:2;rx:10}.cache{fill:#edf4ee;stroke:#718b76;stroke-width:2;rx:10}.l{stroke:#315c57;stroke-width:2;marker-end:url(#a)}</style></defs>
  <text x="45" y="48" class="title">Latest-wins：新按键取消旧 generation，但 Prefix Cache 有独立生命周期</text>
  <text x="45" y="82" class="s">观察重点：generation identity、GPU 可中断边界、suffix page 回收和 persistent prefix page 不是同一个状态。</text>
  <rect x="45" y="125" width="240" height="390" class="b"/><text x="70" y="165" class="h">时间 t0 · generation 17</text>
  <rect x="70" y="195" width="190" height="55" class="old"/><text x="88" y="228" class="t">旧 Prefix + 8 branches</text><rect x="70" y="280" width="190" height="55" class="cache"/><text x="88" y="313" class="t">persistent prefix pages</text><rect x="70" y="365" width="190" height="55" class="old"/><text x="88" y="398" class="t">branch suffix pages</text><text x="70" y="465" class="s">_run_lock 持有 GPU 执行区</text>
  <line x1="285" y1="320" x2="365" y2="320" class="l"/><rect x="370" y="125" width="250" height="390" class="b"/><text x="395" y="165" class="h">时间 t1 · 新按键到达</text><text x="395" y="210" class="t">new_generation()</text><text x="395" y="245" class="t">1. generation 17.cancel()</text><text x="395" y="280" class="t">2. generation id → 18</text><text x="395" y="315" class="t">3. 返回新 CancellationToken</text><text x="395" y="370" class="s">_generation_lock 只保护 identity 切换</text><text x="395" y="400" class="s">不会从 CPU 中途撕裂 CUDA kernel</text><text x="395" y="445" class="s">新 complete 等待 _run_lock</text>
  <line x1="620" y1="320" x2="700" y2="320" class="l"/><rect x="705" y="125" width="210" height="390" class="b"/><text x="730" y="165" class="h">安全 token-step 边界</text><text x="730" y="215" class="t">旧组检查 cancelled</text><text x="730" y="250" class="t">停止继续 Decode</text><text x="730" y="285" class="t">不交付旧候选</text><text x="730" y="335" class="t">释放 suffix pages</text><text x="730" y="380" class="t">保留可复用 prefix pages</text><text x="730" y="435" class="s">finally 保证异常路径也回收</text>
  <line x1="915" y1="320" x2="985" y2="320" class="l"/><rect x="990" y="155" width="165" height="325" class="new"/><text x="1012" y="195" class="h">generation 18</text><text x="1012" y="245" class="t">取得 _run_lock</text><text x="1012" y="280" class="t">token-LCP reuse</text><text x="1012" y="315" class="t">新 CandidateGroup</text><text x="1012" y="350" class="t">只交付最新结果</text><text x="1012" y="410" class="s">latest-wins 是交付语义</text>
</svg>
