<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720">
<style>.t{font:15px system-ui;fill:#263238}.h{font:700 19px system-ui;fill:#17202a}.title{font:700 28px system-ui;fill:#17202a}.b{fill:#f7faf9;stroke:#315c57;stroke-width:2;rx:12}.a{stroke:#315c57;stroke-width:2;marker-end:url(#m)}.s{font:13px system-ui;fill:#455a64}</style><defs><marker id="m" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0 0L10 3L0 6Z" fill="#315c57"/></marker></defs>
<text x="35" y="45" class="title">一次请求的真实调用链：控制面准备 Batch，执行面只跑当前 Batch</text>
<g><rect x="35" y="95" width="190" height="120" class="b"/><text x="55" y="130" class="h">LLM.generate</text><text x="55" y="162" class="t">Tokenizer / SamplingParams</text><text x="55" y="188" class="t">Page Table / Managers</text></g>
<line x1="225" y1="155" x2="280" y2="155" class="a"/><rect x="285" y="95" width="190" height="120" class="b"/><text x="305" y="130" class="h">Scheduler</text><text x="305" y="162" class="t">Pending / Running</text><text x="305" y="188" class="t">Prefill-first</text>
<line x1="475" y1="155" x2="530" y2="155" class="a"/><rect x="535" y="95" width="190" height="120" class="b"/><text x="555" y="130" class="h">Batch prepare</text><text x="555" y="162" class="t">input_ids / positions</text><text x="555" y="188" class="t">out_loc / metadata</text>
<line x1="725" y1="155" x2="780" y2="155" class="a"/><rect x="785" y="95" width="190" height="120" class="b"/><text x="805" y="130" class="h">Engine.run_batch</text><text x="805" y="162" class="t">bind Context</text><text x="805" y="188" class="t">forward + sample</text>
<line x1="975" y1="155" x2="1030" y2="155" class="a"/><rect x="1035" y="95" width="205" height="120" class="b"/><text x="1055" y="130" class="h">process output</text><text x="1055" y="162" class="t">advance / finish</text><text x="1055" y="188" class="t">free slot + page</text>
<path d="M1135 215V290H380V225" fill="none" class="a"/><text x="605" y="278" class="s">while scheduler.has_work：每轮只产生一个可执行 Batch</text>
<rect x="120" y="380" width="1040" height="245" class="b"/><text x="145" y="418" class="h">两个层次不要混淆</text><text x="155" y="462" class="t">控制面：Scheduler 决定谁能运行、占哪个 slot、写哪些 page、构造什么 metadata。</text><text x="155" y="505" class="t">执行面：Model 只读取 Context 中已经准备好的 Batch，执行 Embedding → Layers → LM Head。</text><text x="155" y="548" class="t">回收面：Scheduler 根据 sample 推进 Req；EOS/预算完成后立即释放逻辑 slot 与物理 page。</text><text x="155" y="590" class="s">这就是为什么读源码应从 LLM.generate 的循环开始，而不是从某个 Linear 类逐行翻译。</text></svg>
