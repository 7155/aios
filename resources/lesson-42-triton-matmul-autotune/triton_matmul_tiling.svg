<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630"><style>.title{font:700 28px system-ui;fill:#17202a}.h{font:700 18px system-ui;fill:#17202a}.t{font:14px system-ui;fill:#263238}.b{fill:#f7faf9;stroke:#315c57;stroke-width:2;rx:12}.a{fill:#eef4fa;stroke:#496a89;stroke-width:2}.c{fill:#edf4ee;stroke:#718b76;stroke-width:2}</style><text x="45" y="48" class="title">Triton GEMM：一个 Program 负责 C Tile，沿 K 维逐块累计</text><rect x="70" y="105" width="250" height="360" class="b"/><text x="100" y="145" class="h">A [M,K]</text><rect x="110" y="190" width="110" height="95" class="a"/><text x="128" y="240" class="t">A Tile</text><text x="95" y="335" class="t">pointer 沿 K 右移</text><rect x="405" y="105" width="250" height="360" class="b"/><text x="435" y="145" class="h">B [K,N]</text><rect x="460" y="190" width="110" height="95" class="a"/><text x="478" y="240" class="t">B Tile</text><text x="430" y="335" class="t">pointer 沿 K 下移</text><rect x="740" y="105" width="380" height="360" class="b"/><text x="770" y="145" class="h">C [M,N]</text><rect x="815" y="190" width="180" height="130" class="c"/><text x="850" y="250" class="h">C Tile</text><text x="790" y="365" class="t">acc[BM,BN] 保存在 FP32 Register</text><text x="790" y="405" class="t">acc += tl.dot(A_tile, B_tile)</text><text x="70" y="535" class="t">BM/BN/BK、num_warps、num_stages 决定数据复用、寄存器、Shared Memory 与 Occupancy；Autotune 按 M/N/K 选配置。</text></svg>