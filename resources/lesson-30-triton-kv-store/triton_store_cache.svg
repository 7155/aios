<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650">
  <defs><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L10,3 L0,6 Z" fill="#315c57"/></marker><style>.title{font:700 28px system-ui,sans-serif;fill:#17202a}.h{font:700 18px system-ui,sans-serif;fill:#17202a}.t{font:14px system-ui,sans-serif;fill:#263238}.s{font:12px system-ui,sans-serif;fill:#455a64}.b{fill:#f7faf9;stroke:#315c57;stroke-width:2;rx:12}.p{fill:#eef4fa;stroke:#496a89;stroke-width:2;rx:10}.c{fill:#edf4ee;stroke:#718b76;stroke-width:2;rx:8}.l{stroke:#315c57;stroke-width:2;marker-end:url(#a)}</style></defs>
  <text x="45" y="48" class="title">Triton KV Scatter：每个 Program 读取一个 Token 行，写到任意物理 Page</text>
  <text x="45" y="80" class="s">例子：indices=[17,4,9]，每行 width=KV heads×head_dim。行内连续访问，行间目标可散乱。</text>
  <rect x="45" y="120" width="240" height="430" class="b"/><text x="70" y="158" class="h">Flat K/V 输入</text><rect x="70" y="190" width="190" height="70" class="p"/><text x="90" y="220" class="t">token 0 · width lanes</text><text x="90" y="245" class="s">k_ptr + 0×stride + offsets</text><rect x="70" y="285" width="190" height="70" class="p"/><text x="90" y="315" class="t">token 1 · width lanes</text><text x="90" y="340" class="s">k_ptr + 1×stride + offsets</text><rect x="70" y="380" width="190" height="70" class="p"/><text x="90" y="410" class="t">token 2 · width lanes</text><text x="90" y="435" class="s">k_ptr + 2×stride + offsets</text>
  <line x1="285" y1="335" x2="375" y2="335" class="l"/><rect x="380" y="120" width="300" height="430" class="b"/><text x="405" y="158" class="h">三个 Triton Program</text><text x="405" y="205" class="t">pid 0 → index=17</text><text x="405" y="240" class="t">pid 1 → index=4</text><text x="405" y="275" class="t">pid 2 → index=9</text><text x="405" y="330" class="t">offsets = arange(0, block_size)</text><text x="405" y="365" class="t">mask = offsets &lt; width</text><text x="405" y="420" class="s">每个 Program 内：</text><text x="405" y="448" class="s">连续 load K/V → 计算目标地址 → 连续 store</text><text x="405" y="485" class="s">不同 Program 写不同 Page，无需 atomic</text>
  <line x1="680" y1="335" x2="760" y2="335" class="l"/><rect x="765" y="105" width="385" height="475" class="b"/><text x="790" y="145" class="h">Physical KV Cache</text><g class="s"><rect x="790" y="175" width="330" height="45" class="c"/><text x="810" y="203">page 4  ← token 1 K/V</text><rect x="790" y="235" width="330" height="45" class="c"/><text x="810" y="263">page 9  ← token 2 K/V</text><rect x="790" y="295" width="330" height="45" class="c"/><text x="810" y="323">page 17 ← token 0 K/V</text><rect x="790" y="355" width="330" height="45" class="c"/><text x="810" y="383">其他 page 保持不变</text></g><text x="790" y="455" class="t">cache_offset = index×cache_stride+offset</text><text x="790" y="490" class="s">Scatter 的随机性只在“行目标”；</text><text x="790" y="515" class="s">每一行内部仍是连续、可合并的显存访问。</text>
</svg>
