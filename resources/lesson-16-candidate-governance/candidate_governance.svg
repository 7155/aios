<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="690" viewBox="0 0 1200 690">
  <defs><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L10,3 L0,6 Z" fill="#315c57"/></marker><style>.title{font:700 28px system-ui,sans-serif;fill:#17202a}.h{font:700 17px system-ui,sans-serif;fill:#17202a}.t{font:14px system-ui,sans-serif;fill:#263238}.s{font:12.5px system-ui,sans-serif;fill:#455a64}.b{fill:#f7faf9;stroke:#315c57;stroke-width:2;rx:12}.x{fill:#fff3ee;stroke:#9a6047;stroke-width:2;rx:10}.ok{fill:#edf4ee;stroke:#718b76;stroke-width:2;rx:10}.l{stroke:#315c57;stroke-width:2;marker-end:url(#a)}</style></defs>
  <text x="45" y="48" class="title">从 Raw Branch 到 Top-3：探索分布、模型分数和产品治理必须分层</text>
  <text x="45" y="80" class="s">观察重点：temperature / top-k / top-p 决定“去哪里探索”，raw logprob 决定“原模型多支持”，MMR 只组织候选池。</text>
  <rect x="45" y="125" width="150" height="120" class="b"/><text x="70" y="165" class="h">原始 logits</text><text x="70" y="200" class="s">保留 raw logsoftmax</text>
  <line x1="195" y1="185" x2="250" y2="185" class="l"/><rect x="255" y="115" width="180" height="140" class="b"/><text x="280" y="150" class="h">Sampling copy</text><text x="280" y="183" class="t">temperature</text><text x="280" y="208" class="t">top-k / top-p</text><text x="280" y="233" class="t">stop-token mask</text>
  <line x1="435" y1="185" x2="490" y2="185" class="l"/><rect x="495" y="125" width="150" height="120" class="b"/><text x="520" y="165" class="h">8 raw branches</text><text x="520" y="200" class="s">独立随机流</text>
  <line x1="645" y1="185" x2="700" y2="185" class="l"/><rect x="705" y="115" width="180" height="140" class="b"/><text x="730" y="150" class="h">Decode + Score</text><text x="730" y="183" class="t">中文文本</text><text x="730" y="208" class="t">raw avg logprob</text><text x="730" y="233" class="t">stop reason</text>
  <line x1="795" y1="255" x2="795" y2="315" class="l"/>
  <rect x="85" y="325" width="180" height="130" class="x"/><text x="110" y="360" class="h">Hard filter</text><text x="110" y="393" class="t">empty / too long</text><text x="110" y="418" class="t">assistant / repeat</text><text x="110" y="443" class="t">unfinished / boundary</text>
  <line x1="265" y1="390" x2="330" y2="390" class="l"/><rect x="335" y="325" width="180" height="130" class="b"/><text x="360" y="360" class="h">Normalize + Dedup</text><text x="360" y="393" class="t">去空白 / 尾标点</text><text x="360" y="418" class="t">同 display key</text><text x="360" y="443" class="t">只保留高分项</text>
  <line x1="515" y1="390" x2="580" y2="390" class="l"/><rect x="585" y="325" width="180" height="130" class="b"/><text x="610" y="360" class="h">Base score</text><text x="610" y="393" class="t">raw avg logprob</text><text x="610" y="418" class="t">− soft penalty</text><text x="610" y="443" class="s">不是 sampling prob</text>
  <line x1="765" y1="390" x2="830" y2="390" class="l"/><rect x="835" y="325" width="180" height="130" class="b"/><text x="860" y="360" class="h">MMR selection</text><text x="860" y="393" class="t">质量 − λ×相似度</text><text x="860" y="418" class="t">依次选 3 条</text><text x="860" y="443" class="s">不创造新语义</text>
  <line x1="1015" y1="390" x2="1080" y2="390" class="l"/><rect x="1085" y="340" width="90" height="95" class="ok"/><text x="1105" y="380" class="h">Top-3</text><text x="1102" y="407" class="s">可显示</text>
  <rect x="255" y="520" width="690" height="105" class="b"/><text x="285" y="555" class="h">同拼音/固定候选重排序走另一条路</text><text x="285" y="585" class="t">词典先保证“会议 / 会意 / 悔意 / 回忆”读音合法 → LM teacher-force 每条中文候选 → stable varlen prefill 排序</text><text x="285" y="610" class="s">开放生成需要探索与治理；固定候选只需要稳定的条件概率比较。</text>
</svg>
