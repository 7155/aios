    <title id="title">Backward：用 O / LSE 重算概率与梯度</title><desc id="desc">不保存完整 Probability Matrix；通过 LSE 恢复局部 P，再沿标准 Softmax 梯度链计算 dQ / dK / dV。</desc><defs>
