    <text x="70" y="128" font-family="Noto Sans CJK SC, sans-serif" font-size="43" font-weight="800" fill="#0F172A" text-anchor="start">Backward：用 O / LSE 重算概率与梯度</text>
    <text x="70" y="171" font-family="Noto Sans CJK SC, sans-serif" font-size="24" font-weight="500" fill="#475569" text-anchor="start">不保存完整 Probability Matrix；通过 LSE 恢复局部 P，再沿标准 Softmax 梯度链计算 dQ / dK / dV。</text>
    <rect x="70" y="245" width="290" height="430" rx="24" fill="url(#blueGrad)" stroke="#2563EB" stroke-width="2" opacity="1.0"/><text x="100" y="292" font-family="Noto Sans CJK SC, sans-serif" font-size="28" font-weight="800" fill="#2563EB" text-anchor="start">Forward</text><text x="100" y="338" font-family="Noto Sans CJK SC, sans-serif" font-size="24" font-weight="750" fill="#0F172A" text-anchor="start"><tspan x="100" dy="0">S = scale · QK^T</tspan><tspan x="100" dy="37.2">P = softmax(S)</tspan><tspan x="100" dy="37.2">O = PV</tspan></text><rect x="100" y="500" width="230" height="70" rx="14" fill="#D1FAE5" stroke="#059669" stroke-width="2" opacity="1.0"/><text x="215" y="531" font-family="Noto Sans CJK SC, sans-serif" font-size="20" font-weight="800" fill="#059669" text-anchor="middle">保存 O [N,D]</text><text x="215" y="558" font-family="Noto Sans CJK SC, sans-serif" font-size="18" font-weight="700" fill="#475569" text-anchor="middle">保存 LSE [N]</text><rect x="100" y="590" width="230" height="54" rx="14" fill="#FEE2E2" stroke="#DC2626" stroke-width="1" opacity="1.0"/><text x="215" y="624" font-family="Noto Sans CJK SC, sans-serif" font-size="19" font-weight="800" fill="#DC2626" text-anchor="middle">不保存 P [N,N]</text><line x1="380" y1="460" x2="510" y2="460" stroke="#7C3AED" stroke-width="4" stroke-linecap="round" marker-end="url(#arrow)"/><rect x="385" y="392" width="120" height="42" rx="21" fill="#EDE9FE" stroke="#EDE9FE" stroke-width="0" opacity="1.0"/><text x="445.0" y="421" font-family="Noto Sans CJK SC, sans-serif" font-size="18" font-weight="700" fill="#7C3AED" text-anchor="middle">按 Tile 重算</text><rect x="520" y="245" width="330" height="430" rx="24" fill="url(#purpleGrad)" stroke="#7C3AED" stroke-width="2" opacity="1.0"/><text x="550" y="292" font-family="Noto Sans CJK SC, sans-serif" font-size="28" font-weight="800" fill="#7C3AED" text-anchor="start">恢复局部概率</text><text x="550" y="345" font-family="Noto Sans CJK SC, sans-serif" font-size="23" font-weight="800" fill="#0F172A" text-anchor="start">P_tile = exp(S_tile − LSE)</text><text x="550" y="385" font-family="Noto Sans CJK SC, sans-serif" font-size="23" font-weight="800" fill="#0F172A" text-anchor="start">D = rowsum(dO ⊙ O)</text><rect x="550" y="425" width="270" height="160" rx="16" fill="#FFFFFF" stroke="#C4B5FD" stroke-width="2" opacity="1.0"/><text x="575" y="465" font-family="Noto Sans CJK SC, sans-serif" font-size="21" font-weight="700" fill="#334155" text-anchor="start"><tspan x="575" dy="0">dP = dO · V^T</tspan><tspan x="575" dy="32.550000000000004">dS = P ⊙ (dP − D)</tspan><tspan x="575" dy="32.550000000000004">sum(row dS) = 0</tspan></text><text x="685" y="630" font-family="Noto Sans CJK SC, sans-serif" font-size="18" font-weight="650" fill="#475569" text-anchor="middle">只重算当前 Tile，不物化完整 P</text><line x1="870" y1="460" x2="970" y2="460" stroke="#7C3AED" stroke-width="4" stroke-linecap="round" marker-end="url(#arrow)"/><rect x="980" y="245" width="350" height="430" rx="24" fill="url(#greenGrad)" stroke="#059669" stroke-width="2" opacity="1.0"/><text x="1010" y="292" font-family="Noto Sans CJK SC, sans-serif" font-size="28" font-weight="800" fill="#059669" text-anchor="start">三个标准梯度</text><rect x="1010" y="340" width="290" height="66" rx="14" fill="#FFFFFF" stroke="#6EE7B7" stroke-width="1" opacity="1.0"/><text x="1040" y="369" font-family="Noto Sans CJK SC, sans-serif" font-size="23" font-weight="850" fill="#059669" text-anchor="start">dV</text><text x="1110" y="369" font-family="Noto Sans CJK SC, sans-serif" font-size="21" font-weight="750" fill="#0F172A" text-anchor="start">P^T · dO</text><text x="1040" y="394" font-family="Noto Sans CJK SC, sans-serif" font-size="17" font-weight="600" fill="#475569" text-anchor="start">[N,D]</text><rect x="1010" y="430" width="290" height="66" rx="14" fill="#FFFFFF" stroke="#6EE7B7" stroke-width="1" opacity="1.0"/><text x="1040" y="459" font-family="Noto Sans CJK SC, sans-serif" font-size="23" font-weight="850" fill="#059669" text-anchor="start">dQ</text><text x="1110" y="459" font-family="Noto Sans CJK SC, sans-serif" font-size="21" font-weight="750" fill="#0F172A" text-anchor="start">scale · dS · K</text><text x="1040" y="484" font-family="Noto Sans CJK SC, sans-serif" font-size="17" font-weight="600" fill="#475569" text-anchor="start">[N,D]</text><rect x="1010" y="520" width="290" height="66" rx="14" fill="#FFFFFF" stroke="#6EE7B7" stroke-width="1" opacity="1.0"/><text x="1040" y="549" font-family="Noto Sans CJK SC, sans-serif" font-size="23" font-weight="850" fill="#059669" text-anchor="start">dK</text><text x="1110" y="549" font-family="Noto Sans CJK SC, sans-serif" font-size="21" font-weight="750" fill="#0F172A" text-anchor="start">scale · dS^T · Q</text><text x="1040" y="574" font-family="Noto Sans CJK SC, sans-serif" font-size="17" font-weight="600" fill="#475569" text-anchor="start">[N,D]</text><rect x="1010" y="625" width="290" height="42" rx="21" fill="#D1FAE5" stroke="#D1FAE5" stroke-width="0" opacity="1.0"/><text x="1155.0" y="654" font-family="Noto Sans CJK SC, sans-serif" font-size="18" font-weight="700" fill="#059669" text-anchor="middle">增加重算 FLOPs，减少 HBM IO</text>
