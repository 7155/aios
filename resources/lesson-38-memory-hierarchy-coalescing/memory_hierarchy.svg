<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650"><style>.title{font:700 28px system-ui;fill:#17202a}.h{font:700 18px system-ui;fill:#17202a}.t{font:14px system-ui;fill:#263238}.b{fill:#f7faf9;stroke:#315c57;stroke-width:2;rx:12}.fast{fill:#edf4ee;stroke:#718b76;stroke-width:2;rx:10}.slow{fill:#fff3ee;stroke:#9a6047;stroke-width:2;rx:10}</style><text x="45" y="48" class="title">GPU 数据路径：越靠近执行单元越快、越小、越受资源限制</text><rect x="70" y="100" width="210" height="80" class="fast"/><text x="105" y="135" class="h">Register</text><text x="105" y="160" class="t">线程私有 / 累加器</text><rect x="330" y="100" width="210" height="80" class="fast"/><text x="365" y="135" class="h">Shared / L1</text><text x="365" y="160" class="t">Block Tile 复用</text><rect x="590" y="100" width="210" height="80" class="b"/><text x="625" y="135" class="h">L2</text><text x="625" y="160" class="t">全 GPU Cache</text><rect x="850" y="100" width="270" height="80" class="slow"/><text x="885" y="135" class="h">HBM / Global</text><text x="885" y="160" class="t">权重、KV、激活</text><text x="70" y="245" class="h">Warp 地址模式</text><text x="70" y="285" class="t">Coalesced：lane 0,1,2,... → address 0,4,8,... → 少量 transaction</text><text x="70" y="325" class="t">Strided：lane 0,1,2,... → address 0,128,256,... → 大量 transaction / overfetch</text><text x="70" y="390" class="h">Shared Memory Bank</text><text x="70" y="430" class="t">word i → bank i mod 32；stride=1 分散到 32 banks</text><text x="70" y="470" class="t">stride=32 全部命中 bank 0 → bank conflict；padding 32→33 可打散映射</text><rect x="700" y="255" width="420" height="270" class="b"/><text x="730" y="295" class="h">AIOS KV Scatter</text><text x="730" y="340" class="t">不同 Program 目标 Page 可离散：17 / 4 / 91</text><text x="730" y="380" class="t">但每个 Program 内 offsets 0..255 连续</text><text x="730" y="420" class="t">→ Page 内 K/V 连续写，仍可合并</text><text x="730" y="475" class="t">Random Page ≠ Random Element Access</text></svg>