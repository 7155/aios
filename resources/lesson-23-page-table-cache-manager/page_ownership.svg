<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="670" viewBox="0 0 1200 670"><defs><marker id="m" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0 0L10 3L0 6Z" fill="#315c57"/></marker></defs><style>.title{font:700 28px system-ui;fill:#17202a}.h{font:700 18px system-ui;fill:#17202a}.t{font:15px system-ui;fill:#263238}.s{font:13px system-ui;fill:#455a64}.b{fill:#f7faf9;stroke:#315c57;stroke-width:2;rx:12}.p{fill:#edf4ee;stroke:#718b76;stroke-width:2;rx:8}.a{stroke:#315c57;stroke-width:2;marker-end:url(#m)}</style><text x="35" y="48" class="title">三种身份：Request Slot、Token Position、Physical KV Page</text>
<rect x="45" y="105" width="250" height="200" class="b"/><text x="70" y="145" class="h">Table Slot = 2</text><text x="70" y="182" class="t">token_pool[2] 保存 Token ID</text><text x="70" y="217" class="t">page_table[2] 保存 Page ID</text><text x="70" y="252" class="s">Slot 表示“当前哪个请求占这一行”</text>
<line x1="295" y1="205" x2="380" y2="205" class="a"/><rect x="385" y="95" width="340" height="220" class="b"/><text x="410" y="135" class="h">page_table[2, position]</text><text x="410" y="177" class="t">position: 0  1  2  3</text><text x="410" y="215" class="t">page id: 7  4  9  1</text><text x="410" y="255" class="s">逻辑顺序可以映射到不连续物理页</text>
<line x1="725" y1="205" x2="810" y2="205" class="a"/><rect x="815" y="95" width="330" height="220" class="b"/><text x="840" y="135" class="h">MHAKVCache Physical Pool</text><g class="t"><rect x="850" y="165" width="55" height="55" class="p"/><text x="870" y="198">1</text><rect x="920" y="165" width="55" height="55" class="p"/><text x="940" y="198">4</text><rect x="990" y="165" width="55" height="55" class="p"/><text x="1010" y="198">7</text><rect x="1060" y="165" width="55" height="55" class="p"/><text x="1080" y="198">9</text></g><text x="840" y="260" class="s">每页含所有层该 token 的 K/V 位置</text>
<rect x="175" y="400" width="850" height="160" class="b"/><text x="205" y="440" class="h">释放顺序</text><text x="205" y="478" class="t">读取 used_pages = page_table[slot, :cached_len] → TableManager.free(slot) → CacheManager._free(used_pages)</text><text x="205" y="515" class="s">释放 slot 只允许新请求复用行；释放 Page 才把物理 KV 容量归还。两者漏掉任何一个都会造成不同类型的资源泄漏。</text></svg>
