<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650"><style>.title{font:700 28px system-ui;fill:#17202a}.h{font:700 18px system-ui;fill:#17202a}.t{font:14px system-ui;fill:#263238}.axis{stroke:#263238;stroke-width:2}.roof{stroke:#315c57;stroke-width:4;fill:none}.b{fill:#f7faf9;stroke:#315c57;stroke-width:2;rx:12}.dot{fill:#9a6047}</style><text x="45" y="48" class="title">Roofline 只是第一层：还要检查并行度和 CPU Launch Gap</text><line x1="90" y1="500" x2="760" y2="500" class="axis"/><line x1="90" y1="500" x2="90" y2="100" class="axis"/><path d="M110,475 L450,180 L730,180" class="roof"/><text x="500" y="165" class="h">Compute Roof</text><text x="175" y="350" class="h">Bandwidth Roof</text><circle cx="230" cy="390" r="9" class="dot"/><text x="245" y="395" class="t">RMSNorm / KV Scatter</text><circle cx="390" cy="280" r="9" class="dot"/><text x="405" y="285" class="t">Decode GEMM</text><circle cx="610" cy="180" r="9" class="dot"/><text x="625" y="215" class="t">大 Prefill GEMM</text><text x="285" y="545" class="t">Arithmetic Intensity (FLOPs / byte) →</text><text x="20" y="300" class="t" transform="rotate(-90 20 300)">Performance ↑</text><rect x="805" y="105" width="340" height="395" class="b"/><text x="835" y="145" class="h">诊断顺序</text><text x="835" y="190" class="t">1. 工作够大吗？Block 足够吗？</text><text x="835" y="230" class="t">否 → Latency / Under-utilization</text><text x="835" y="280" class="t">2. Intensity 低于机器 balance？</text><text x="835" y="320" class="t">是 → Memory 候选</text><text x="835" y="370" class="t">3. Tensor Core/SM 接近上限？</text><text x="835" y="410" class="t">是 → Compute 候选</text><text x="835" y="460" class="t">4. 回到完整 Top-3 p95 验收</text></svg>