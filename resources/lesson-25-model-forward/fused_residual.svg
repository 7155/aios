<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="690" viewBox="0 0 1200 690"><defs><marker id="m" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0 0L10 3L0 6Z" fill="#315c57"/></marker></defs><style>.title{font:700 28px system-ui;fill:#17202a}.h{font:700 18px system-ui;fill:#17202a}.t{font:15px system-ui;fill:#263238}.s{font:13px system-ui;fill:#455a64}.b{fill:#f7faf9;stroke:#315c57;stroke-width:2;rx:12}.r{fill:#edf4ee;stroke:#718b76;stroke-width:2;rx:10}.a{stroke:#315c57;stroke-width:2;marker-end:url(#m)}</style><text x="35" y="48" class="title">Fused Residual + RMSNorm：代码里没有显式 h = h + branch，但语义仍在</text>
<rect x="55" y="105" width="250" height="165" class="r"/><text x="80" y="145" class="h">residual stream</text><text x="80" y="185" class="t">保存未归一化主线 h</text><text x="80" y="220" class="s">跨子层累积 Attention/MLP 增量</text>
<rect x="390" y="95" width="280" height="185" class="b"/><text x="415" y="135" class="h">fused_add_rmsnorm(x, residual)</text><text x="415" y="177" class="t">residual ← residual + x</text><text x="415" y="215" class="t">x ← RMSNorm(residual)</text><text x="415" y="250" class="s">一次 kernel 完成 add + norm</text><line x1="305" y1="185" x2="390" y2="185" class="a"/>
<line x1="670" y1="185" x2="755" y2="185" class="a"/><rect x="760" y="105" width="250" height="165" class="b"/><text x="785" y="145" class="h">下一分支输入 x</text><text x="785" y="185" class="t">Attention 或 SwiGLU</text><text x="785" y="220" class="s">输出只是新的增量 Δh</text>
<path d="M885 270V355H180V270" fill="none" class="a"/><text x="450" y="342" class="s">分支输出在下一次 Fused Norm 前写回 residual stream</text>
<rect x="170" y="430" width="860" height="150" class="b"/><text x="200" y="468" class="h">概念等价的 Pre-Norm Block</text><text x="200" y="510" class="t">h₁ = h₀ + Attention(RMSNorm(h₀))</text><text x="200" y="545" class="t">h₂ = h₁ + MLP(RMSNorm(h₁))</text><text x="650" y="510" class="s">AIOS 将“加法 + 下一次归一化”融合，减少显存读写和 kernel launch。</text></svg>
