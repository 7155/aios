ext x="864" y="291" font-family="Noto Sans CJK SC, sans-serif" font-size="27" font-weight="800" fill="#7C3AED" text-anchor="start">Backward</text><text x="864" y="329" font-family="Noto Sans CJK SC, sans-serif" font-size="20" font-weight="600" fill="#475569" text-anchor="start"><tspan x="864" dy="0">重算局部 P</tspan></text><line x1="1068" y1="317.5" x2="1094" y2="317.5" stroke="#334155" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow)"/><g filter="url(#shadow)"><rect x="1102" y="245" width="216" height="145" rx="22" fill="url(#amberGrad)" stroke="#D97706" stroke-width="2" opacity="1.0"/></g><text x="1122" y="291" font-family="Noto Sans CJK SC, sans-serif" font-size="27" font-weight="800" fill="#D97706" text-anchor="start">dQ / dK / dV</text><text x="1122" y="329" font-family="Noto Sans CJK SC, sans-serif" font-size="20" font-weight="600" fill="#475569" text-anchor="start"><tspan x="1122" dy="0">唯一输出所有权</tspan></text><rect x="70" y="455" width="820" height="265" rx="24" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="2" opacity="1.0"/><text x="100" y="505" font-family="Noto Sans CJK SC, sans-serif" font-size="28" font-weight="800" fill="#0F172A" text-anchor="start">为什么 FlashAttention 值得学</text><rect x="100" y="535" width="155" height="42" rx="21" fill="#FEE2E2" stroke="#FEE2E2" stroke-width="0" opacity="1.0"/><text x="177.5" y="564" font-family="Noto Sans CJK SC, sans-serif" font-size="18" font-weight="700" fill="#DC2626" text-anchor="middle">Naive Attention</text><text x="285" y="565" font-family="Noto Sans CJK SC, sans-serif" font-size="22" font-weight="600" fill="#475569" text-anchor="start">Score / Probability 物化到 HBM</text><rect x="100" y="590" width="610" height="42" rx="10" fill="#FEE2E2" stroke="#FCA5A5" stroke-width="1" opacity="1.0"/><text x="720" y="619" font-family="Noto Sans CJK SC, sans-serif" font-size="22" font-weight="800" fill="#DC2626" text-anchor="start">O(N²)</text><rect x="100" y="650" width="155" height="42" rx="21" fill="#D1FAE5" stroke="#D1FAE5" stroke-width="0" opacity="1.0"/><text x="177.5" y="679" font-family="Noto Sans CJK SC, sans-serif" font-size="18" font-weight="700" fill="#059669" text-anchor="middle">FlashAttention</text><rect x="285" y="650" width="190" height="42" rx="10" fill="#D1FAE5" stroke="#6EE7B7" stroke-width="1" opacity="1.0"/><text x="492" y="679" font-family="Noto Sans CJK SC, sans-serif" font-size="22" font-weight="800" fill="#059669" text-anchor="start">O(N) 状态</text><text x="100" y="704" font-family="Noto Sans CJK SC, sans-serif" font-size="20" font-weight="600" fill="#475569" text-anchor="start">计算仍是精确全注意力；主要减少中间矩阵的存储与 HBM 往返。</text><g filter="url(#shadow)"><rect x="930" y="455" width="400" height="265" rx="24" fill="#FFFFFF" stroke="#7C3AED" stroke-width="2" opacity="1.0"/></g><text x="960" y="505" font-family="Noto Sans CJK SC, sans-serif" font-size="28" font-weight="800" fill="#7C3AED" text-anchor="start">AIOS 边界</text><text x="960" y="552" font-family="Noto Sans CJK SC, sans-serif" font-size="22" font-weight="650" fill="#0F172A" text-anchor="start"><tspan x="960" dy="0">这份仓库：连续 Dense Attention</tspan><tspan x="960" dy="34.1">AIOS 当前：Varlen + Paged KV</tspan><tspan x="960" dy="34.1">学习机制 ≠ 直接替换 FlashInfer</tspan></text><rect x="960" y="665" width="300" height="42" rx="21" fill="#EDE9FE" stroke="#EDE9FE" stroke-width="0" opacity="1.0"/><text x="1110.0" y="694" font-family="Noto Sans CJK SC, sans-serif" font-size="18" font-weight="700" fill="#7C3AED" text-anchor="middle">先理解 Kernel，再谈 Runtime</text>
