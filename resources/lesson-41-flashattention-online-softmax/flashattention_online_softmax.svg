<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="660" viewBox="0 0 1200 660"><style>.title{font:700 28px system-ui;fill:#17202a}.h{font:700 18px system-ui;fill:#17202a}.t{font:14px system-ui;fill:#263238}.b{fill:#f7faf9;stroke:#315c57;stroke-width:2;rx:12}.tile{fill:#eef4fa;stroke:#496a89;stroke-width:2;rx:8}.state{fill:#edf4ee;stroke:#718b76;stroke-width:2;rx:8}</style><text x="45" y="48" class="title">FlashAttention：Score Tile 计算后立即更新 m / l / O，不写完整 T×T Matrix</text><rect x="55" y="105" width="250" height="430" class="b"/><text x="85" y="145" class="h">Naive</text><text x="85" y="195" class="t">QKᵀ → S [T,T]</text><text x="85" y="235" class="t">写 HBM</text><text x="85" y="285" class="t">Softmax → P [T,T]</text><text x="85" y="325" class="t">再写/读 HBM</text><text x="85" y="375" class="t">P @ V → O</text><text x="85" y="445" class="t">完整中间矩阵造成 IO</text><rect x="355" y="105" width="790" height="430" class="b"/><text x="385" y="145" class="h">Tiled + Online Softmax</text><rect x="390" y="185" width="180" height="95" class="tile"/><text x="420" y="220" class="t">K/V Tile 0</text><text x="420" y="250" class="t">score block</text><rect x="610" y="185" width="180" height="95" class="tile"/><text x="640" y="220" class="t">K/V Tile 1</text><text x="640" y="250" class="t">score block</text><rect x="830" y="185" width="180" height="95" class="tile"/><text x="860" y="220" class="t">K/V Tile ...</text><rect x="470" y="335" width="470" height="135" class="state"/><text x="500" y="372" class="h">Running state per Query Tile</text><text x="500" y="407" class="t">m = seen max score</text><text x="500" y="435" class="t">l = exp sum under m · O_acc = weighted value sum</text><text x="385" y="510" class="t">新块最大值改变时，用 alpha = exp(m_old - m_new) 重缩放旧状态</text><text x="355" y="585" class="t">数学仍是 exact softmax attention；减少的是 HBM 中间读写，不是 T² score 计算。</text></svg>