name: AIOS-IME Course

on:
  pull_request:
    paths:
      - "course/aios-ime/**"
      - "resources/README.md"
      - ".github/workflows/aios-ime-course.yml"
  push:
    branches:
      - main
    paths:
      - "course/aios-ime/**"
      - "resources/README.md"
      - ".github/workflows/aios-ime-course.yml"

permissions:
  contents: read

concurrency:
  group: aios-ime-course-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate curriculum, source anchors and web assets
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install lightweight validator dependency
        run: python -m pip install --disable-pip-version-check PyYAML

      - name: Validate AIOS-IME course
        run: python course/aios-ime/scripts/validate_course.py

      - name: Validate JSON assets
        run: |
          python -m json.tool course/aios-ime/site-manifest.json >/dev/null
          python -m json.tool course/aios-ime/source-symbols.json >/dev/null

      - name: Check browser JavaScript syntax
        run: |
          node --check course/aios-ime/assets/course.js
          node --check course/aios-ime/assets/course-render.js
          node --check course/aios-ime/assets/course-utils.js
